<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tung Tung RNG — Brainrot Collector</title>
<style>
:root{
  --bg:#070812;--panel:#111426;--panel2:#171b31;--line:#2a3152;
  --text:#f5f7ff;--muted:#9ca5c9;--accent:#8b5cf6;--accent2:#22d3ee;
  --good:#34d399;--gold:#fbbf24;--danger:#fb7185;
}
*{box-sizing:border-box} body{margin:0;background:
radial-gradient(circle at 15% 10%,#25104d 0,transparent 28%),
radial-gradient(circle at 90% 5%,#063c50 0,transparent 25%),var(--bg);
color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1250px;margin:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.logo{font-size:24px;font-weight:900;letter-spacing:-.8px}.logo span{color:var(--accent2)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#11162a;border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.nav button,.filter{
background:#101426;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800}
.nav button.active,.filter.active{background:linear-gradient(135deg,#7c3aed,#2563eb);border-color:transparent}
.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.panel{background:linear-gradient(180deg,#12162a,#0e1120);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px #0007}
.rollPanel{padding:28px;text-align:center;min-height:570px;display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--accent2);font-weight:900;font-size:12px;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(34px,5vw,62px);margin:8px 0 4px;line-height:.95}
.subtitle{color:var(--muted);margin:0 auto 18px;max-width:550px}
.result{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result img,.fallback{width:210px;height:210px;object-fit:contain;filter:drop-shadow(0 20px 25px #0009)}
.fallback{display:grid;place-items:center;border-radius:32px;background:linear-gradient(135deg,#252b4d,#121628);border:1px solid #414b76;font-size:72px}
.resultName{font-size:26px;font-weight:950;margin-top:12px}.chance{color:var(--gold);font-weight:800;margin-top:5px}
.roll{margin-top:10px;border:0;border-radius:18px;padding:17px 44px;font-size:22px;font-weight:950;
background:linear-gradient(135deg,#8b5cf6,#06b6d4);box-shadow:0 10px 30px #6d28d955}
.roll:active{transform:translateY(2px)} .roll:disabled{opacity:.6}
.hint{color:var(--muted);font-size:12px;margin-top:9px}
.side{padding:20px}.sideHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.side h2{margin:0;font-size:18px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#090c18;color:white;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;max-height:485px;overflow:auto;padding-right:4px}
.card{background:#101528;border:1px solid #273052;border-radius:15px;padding:10px;text-align:center;min-width:0}
.card img,.miniFallback{width:86px;height:86px;object-fit:contain}.miniFallback{display:grid;place-items:center;margin:auto;background:#191e35;border-radius:12px;font-size:30px}
.cardName{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.cardChance{font-size:10px;color:var(--gold);margin-top:3px}.count{font-size:10px;color:var(--good);margin-top:2px}
.locked{opacity:.55}.locked .miniFallback{filter:grayscale(1)}
.section{margin-top:18px;padding:20px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.filters{display:flex;gap:7px;overflow:auto;padding:12px 0}.filter{white-space:nowrap;font-size:12px;padding:8px 11px}
.fullgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.fullgrid .card img,.fullgrid .miniFallback{width:100%;height:105px}
.empty{text-align:center;color:var(--muted);padding:35px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#171c32;border:1px solid #3a4670;padding:12px 18px;border-radius:14px;font-weight:800;transition:.25s;z-index:5}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.fullgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.app{padding:12px}.rollPanel{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.fullgrid{grid-template-columns:repeat(3,1fr)}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">TUNG TUNG <span>RNG</span> ⚡</div>
    <div class="stats">
      <div class="pill">Rolls: <b id="rolls">0</b></div>
      <div class="pill">Collected: <b id="collected">0</b>/<b id="total">0</b></div>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="showTab('roll',this)">🎲 Roll</button>
    <button onclick="showTab('inventory',this)">🎒 Inventory</button>
    <button onclick="showTab('index',this)">📖 Index</button>
  </div>

  <main id="rollTab">
    <div class="layout">
      <section class="panel rollPanel">
        <div class="kicker">brainrot collector</div>
        <h1>TUNG TUNG RNG</h1>
        <p class="subtitle">Roll the most questionable creatures ever assembled. Can you hit the secret?</p>
        <div class="result" id="result"></div>
        <button class="roll" id="rollBtn" onclick="roll()">ROLL 🎲</button>
        <div class="hint">The Secret Tung Tung is 1 in 7,000,000,000,000,000.</div>
      </section>
      <aside class="panel side">
        <div class="sideHead"><h2>🔥 Recent Rolls</h2><span class="pill" id="recentCount">0</span></div>
        <div id="recent" class="grid"></div>
      </aside>
    </div>
  </main>

  <main id="inventoryTab" style="display:none">
    <section class="panel section">
      <div class="sectionTitle"><h2>🎒 Your Collection</h2><span class="pill" id="invPct">0%</span></div>
      <div class="filters" id="invFilters"></div>
      <div class="fullgrid" id="inventory"></div>
    </section>
  </main>

  <main id="indexTab" style="display:none">
    <section class="panel section">
      <div class="sectionTitle"><h2>📖 Brainrot Index</h2><span class="pill" id="indexCount"></span></div>
      <input class="search" id="search" placeholder="Search brainrots..." oninput="renderIndex()">
      <div class="filters" id="indexFilters"></div>
      <div class="fullgrid" id="index"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const imgBase='https://brainrotcharacters.net/wp-content/uploads/';
const known={
"Tralalero Tralala":"Tralalero-Tralala-Sticker-Transparent-PNG.webp",
"Chimpanzini Bananini":"2026/04/Chimpanzini-Bananini-Banana-Beast-in-Unpeeled-Fury-mode-768x768.webp",
"Lirili Larila":"Lirili-Larila-Sticker-Transparent-PNG.webp",
"Tung Tung Tung Sahur":"2026/04/Tung-Tung-Tung-Sahur-Official-Italian-Brainrot-Character-768x768.webp"
};

const extraNames=[
"Cappuccino Assassino","Bombardino Crocodilo","Bananita Dolfinita","Carrotino Rabbiti","Teatrino Sbaglino",
"Cukababra","Homeworkini Skoolini","Ta Ta Ta Sahur","Strawberry Elephant","Pizza Pepperonini",
"Chick Fil A Pollonero","Chipotle Burritino","Mcdonalds Hamburguerini Payasito","Tor Mai Ke Chodo",
"Barbie Bambola Cabriolettina","Snake Serpentini Bananini","Orcalero Orcala","Trippi Troppi","Los Tralaleritos",
"Dolpalero Dalfala","Bombombini Gusini","Nuclearo Dinossauro","Ballerina Cappuccina","Sneaknoggin",
"Spaghettino Malfunziono","Mozzarello Confusione","Espressona Signora","Odin Din Din Dun","Glorbo Fruttodrillo",
"Rhino Toasterino","Piccione Macchina","Gangster Footera","Puppachini Assasini","To To To Sahur",
"Strawberry Nexo","Clintino Gran Torino Pellegrino","Guitardando Explosivo","Nicotino Cappuccino","Felino Burgerino",
"Bella Ballerina","Frigo Camelo","Bobrito Bandito","La Vaca Saturno Saturnita","Taco Bell Campaniro",
"Lasagnito Pup","Coca-Colino Frizzelino","Sphinxelino Rockelino","Cucumber Hammerino","Cheese Rattatino",
"Boneca Ambalabu","Girafa Celestre","Trulimero Trulicina","Ti Ti Ti Sahur","Nooo My Hotspot",
"Las Tralaleritas","Dragon Cannelloni","Trulimero Trulichina","Tang Tang Kelentang","Static Scientist",
"Michelino Caralinho","Pliosauri Portaeri","Paniniona Ballerina","Maxino Jessinichino","Grammeriso Faboluso",
"Turtleini Violini","Tlang Tlang Tlang Sahur","Zolkino Newspaperino","Peepee Cacanini","Mogini Jawlinini",
"Computerrandoloni","Yappuccino","Nooo La Polizia","Legito Friggito","Lobsterino Mascottino",
"Toiletino Poopito","Burning Ice"
];

const rarityNames=["Common","Uncommon","Rare","Epic","Legendary","Mythic","Brainrot God","Secret"];
function fallback(name,small=false){
  const emoji=["🦈","🍌","☕","🐊","🧌","🍕","🦍","🦑","🧀","🦖","🥤","🤖"][hash(name)%12];
  return `<div class="${small?'miniFallback':'fallback'}">${emoji}</div>`;
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function slugFile(name){
  return imgBase+name.replaceAll(" ","-").replaceAll("’","").replaceAll("'","")+".webp";
}
function imageHTML(c,small=false){
  const src=known[c.name] || slugFile(c.name);
  return `<img src="${src}" alt="${c.name}" onerror="this.outerHTML=fallback('${c.name}',${small})">`;
}
function makeChance(i){
  if(i===0)return "1 in 3";
  if(i===1)return "1 in 5";
  if(i===2)return "1 in 10";
  if(i===3)return "1 in 20";
  if(i===4)return "1 in 50";
  if(i===5)return "1 in 100";
  if(i===6)return "1 in 250";
  if(i===7)return "1 in 500";
  if(i===8)return "1 in 1,000";
  if(i===9)return "1 in 2,500";
  if(i===10)return "1 in 5,000";
  if(i===11)return "1 in 10,000";
  if(i===12)return "1 in 25,000";
  if(i===13)return "1 in 50,000";
  if(i===14)return "1 in 100,000";
  if(i===15)return "1 in 250,000";
  return "1 in "+(500000+i*50000).toLocaleString();
}
const names=["Tralalero Tralala","Chimpanzini Bananini","Lirili Larila","Brr Brr Patapim","Tung Tung Tung Sahur",
...extraNames.filter(x=>!["Tralalero Tralala","Chimpanzini Bananini","Lirili Larila","Tung Tung Tung Sahur"].includes(x))];
const unique=[...new Set(names)];
const chars=unique.map((name,i)=>({name,chance:i===unique.length-1?"1 in 7,000,000,000,000,000":makeChance(i), rarity:i>70?"Legendary":rarityNames[Math.min(7,Math.floor(i/12))], owned:0}));
chars.find(c=>c.name==="Tung Tung Tung Sahur").chance="1 in 100,000";
chars[chars.length-1].name="SECRET TUNG TUNG SAHUR";
chars[chars.length-1].chance="1 in 7,000,000,000,000,000";
chars[chars.length-1].rarity="Secret";
known["SECRET TUNG TUNG SAHUR"]=known["Tung Tung Tung Sahur"];

let rolls=Number(localStorage.getItem("tungRolls")||0);
let owned=JSON.parse(localStorage.getItem("tungOwned")||"{}");
let recent=JSON.parse(localStorage.getItem("tungRecent")||"[]");
let filter="All";

function save(){localStorage.setItem("tungRolls",rolls);localStorage.setItem("tungOwned",JSON.stringify(owned));localStorage.setItem("tungRecent",JSON.stringify(recent))}
function updateStats(){
  document.getElementById("rolls").textContent=rolls;
  const got=Object.keys(owned).filter(k=>owned[k]>0).length;
  document.getElementById("collected").textContent=got;document.getElementById("total").textContent=chars.length;
  document.getElementById("invPct").textContent=Math.round(got/chars.length*100)+"%";
}
function chanceRoll(){
  const r=Math.random();
  if(r<1/7000000000000000)return chars.length-1;
  if(r<0.00001)return chars.findIndex(c=>c.name==="Tung Tung Tung Sahur");
  const weights=chars.map((_,i)=>1/(3+i*1.8));
  let sum=weights.reduce((a,b)=>a+b,0),x=Math.random()*sum;
  for(let i=0;i<weights.length;i++){x-=weights[i];if(x<=0)return i}
  return 0;
}
function roll(){
  const btn=document.getElementById("rollBtn");btn.disabled=true;
  const idx=chanceRoll(),c=chars[idx];rolls++;owned[c.name]=(owned[c.name]||0)+1;
  recent.unshift(c.name);recent=recent.slice(0,6);save();
  const special=c.rarity==="Secret"||c.name==="Tung Tung Tung Sahur";
  document.getElementById("result").innerHTML=`${imageHTML(c)}<div class="resultName">${c.name}</div><div class="chance">Chance: ${c.chance}</div><div class="chance">${c.rarity}</div>`;
  updateStats();renderRecent();renderInventory();renderIndex();
  if(special) toast("🚨 RARE ROLL: "+c.name+" 🚨"); else toast("Rolled "+c.name);
  setTimeout(()=>btn.disabled=false,450);
}
function card(c,lock=false){
  return `<div class="card ${lock?'locked':''}">${lock?fallback("locked",true):imageHTML(c,true)}
  <div class="cardName">${lock?"???":c.name}</div>
  <div class="cardChance">${lock?"???":c.chance}</div>${!lock&&owned[c.name]?`<div class="count">×${owned[c.name]}</div>`:""}</div>`;
}
function renderRecent(){
  document.getElementById("recentCount").textContent=recent.length;
  document.getElementById("recent").innerHTML=recent.length?recent.map(n=>card(chars.find(c=>c.name===n))).join(""):'<div class="empty">Roll something!</div>';
}
function filterButtons(target){
  const vals=["All","Common","Uncommon","Rare","Epic","Legendary","Mythic","Brainrot God","Secret"];
  document.getElementById(target).innerHTML=vals.map(v=>`<button class="filter ${filter===v?'active':''}" onclick="setFilter('${v}')">${v}</button>`).join("");
}
function setFilter(v){filter=v;filterButtons("invFilters");filterButtons("indexFilters");renderInventory();renderIndex()}
function filtered(){
  return chars.filter(c=>filter==="All"||c.rarity===filter)
}
function renderInventory(){
  filterButtons("invFilters");
  const list=filtered().filter(c=>owned[c.name]);
  document.getElementById("inventory").innerHTML=list.length?list.map(c=>card(c)).join(""):'<div class="empty" style="grid-column:1/-1">Nothing here yet. Start rolling! 🎲</div>';
}
function renderIndex(){
  filterButtons("indexFilters");
  const q=(document.getElementById("search")?.value||"").toLowerCase();
  const list=filtered().filter(c=>c.name.toLowerCase().includes(q));
  document.getElementById("indexCount").textContent=list.length+" shown / "+chars.length+" total";
  document.getElementById("index").innerHTML=list.map(c=>card(c,!owned[c.name])).join("");
}
function showTab(tab,btn){
  ["roll","inventory","index"].forEach(x=>document.getElementById(x+"Tab").style.display=x===tab?"block":"none");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  if(tab==="inventory")renderInventory();if(tab==="index")renderIndex();
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),1800)}
document.getElementById("result").innerHTML=`<div class="fallback">🎲</div><div class="resultName">Ready?</div><div class="chance">Your next brainrot is waiting.</div>`;
updateStats();renderRecent();renderInventory();renderIndex();
</script>
</body>
</html>
